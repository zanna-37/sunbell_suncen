send_group:
  name: Send group command
  description: >-
    Drive a group of Sunbell blinds with a single Home-Assistant cover command.
    Pick cover entities (or whole remote devices) in the target picker — the
    integration groups them by remote and computes the most efficient SUNCEN
    burst sequence to reach the requested end state. Tilt operations always
    re-anchor to full-down first when needed; STOP invalidates the tracked tilt.
  target:
    entity:
      integration: sunbell_suncen
      domain: cover
  fields:
    action:
      name: Action
      description: Home-Assistant cover command to apply to the group.
      required: true
      default: open
      selector:
        select:
          options:
            - label: Open
              value: open
            - label: Close
              value: close
            - label: Stop
              value: stop
            - label: Set tilt position
              value: set_tilt_position
    tilt_position:
      name: Tilt position
      description: >-
        Target tilt 0..100 (%). Required when action is "Set tilt position";
        ignored otherwise.
      required: false
      example: 50
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: slider
          unit_of_measurement: "%"

send_group_raw:
  name: Send raw SUNCEN burst
  description: >-
    Send a raw SUNCEN burst (UP / DOWN / STOP / LONG_UP / LONG_DOWN) to a
    group of blinds without any tilt tracking. Tilt state is invalidated on
    every targeted blind; for UP / DOWN / STOP the position is invalidated
    too. Use this when you need to drive the motor directly outside of the
    integration's HA-level model — subsequent HA tilt commands will
    re-anchor with a fresh DOWN cycle.
  target:
    entity:
      integration: sunbell_suncen
      domain: cover
  fields:
    action:
      name: Action
      description: Raw SUNCEN burst name.
      required: true
      default: UP
      selector:
        select:
          options:
            - "UP"
            - "DOWN"
            - "STOP"
            - "LONG_UP"
            - "LONG_DOWN"
